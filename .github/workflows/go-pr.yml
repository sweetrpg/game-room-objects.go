name: PR

concurrency: pr-${{ github.ref }}

on:
    pull_request:
        branches: [develop]
        paths:
            - "**/*.go"
            - go.mod
            - go.sum
            - .go-version

jobs:
    tests:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          name: Linux,
                          os: ubuntu-latest,
                      }
        steps:
            - uses: actions/checkout@v5
            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                go-version-file: go.mod
            - name: Build
              run: go build -v ./...
            - name: Test
              run: go test -v ./...
